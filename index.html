  <script>
/* =========================================================================
   doodles.js — playful margin doodles for the portfolio.
   Hand-drawn engineering + personal line motifs that peek in from the
   page gutters as each section scrolls into view, and flee / wiggle from
   the cursor. Pure vanilla JS, no dependencies. Runs after the React app
   has mounted (it polls for <section>s). Desktop only (>=1180px).
   ========================================================================= */
(function () {
  var REDUCE = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var mq = window.matchMedia('(min-width: 1000px)');
  var started = false;
  var ALL = [];

  /* ---- math & physics symbol catalog ---- */
  var ART = {
    sigma:   '\u2211', integral: '\u222B', pi:      '\u03C0',
    delta:   '\u0394', nabla:    '\u2207', lambda:  '\u03BB',
    alpha:   '\u03B1', omega:    '\u03A9', infinity:'\u221E',
    sqrt:    '\u221A', epsilon:  '\u03B5', phi:     '\u03C6',
    partial: '\u2202', hbar:     '\u210F', mu:      '\u03BC',
    theta:   '\u03B8', psi:      '\u03C8', rho:     '\u03C1',
    tau:     '\u03C4', gamma:    '\u03B3', nu:      '\u03BD',
    eta:     '\u03B7', beta:     '\u03B2', kappa:   '\u03BA',
    angle:   '\u2220', perp:     '\u22A5', approx:  '\u2248',
    propto:  '\u221D', therefore:'\u2234', zeta:    '\u03B6'
  };
  var NAMES = Object.keys(ART);

  function svg(name) {
    return '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">' +
           '<text x="50" y="82" text-anchor="middle" fill="currentColor" ' +
           'font-family="Georgia,serif" font-size="84" font-style="italic">' +
           ART[name] + '</text></svg>';
  }

  /* ---- styles ---- */
  function injectCSS() {
    var css = [
      'html{overflow-x:clip;}',
      '.doodle{position:absolute;pointer-events:none;z-index:40;opacity:0;will-change:transform,opacity;',
      '  transition:transform .9s cubic-bezier(.34,1.45,.45,1),opacity .55s ease;}',
      '.doodle[data-side="left"]{transform:translate(-190%,12px) scale(.4) rotate(-16deg);}',
      '.doodle[data-side="right"]{transform:translate(190%,12px) scale(.4) rotate(16deg);}',
      '.doodle.lit{opacity:1;transform:none;}',
      '.doodle-fly{display:block;width:100%;height:100%;transition:transform .5s cubic-bezier(.22,1,.36,1);}',
      '.doodle-art{display:block;width:100%;height:100%;pointer-events:auto;cursor:grab;',
      '  transform:rotate(var(--base,0deg));}',
      '.doodle-art svg{display:block;width:100%;height:100%;animation:dFloat var(--fdur,4s) ease-in-out infinite;animation-delay:var(--fdel,0s);}',
      '.doodle-art:hover{animation:dWiggle .55s ease;}',
      '@keyframes dFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}',
      '@keyframes dWiggle{0%,100%{transform:rotate(var(--base,0deg))}' +
        '22%{transform:rotate(calc(var(--base,0deg) + 13deg))}' +
        '62%{transform:rotate(calc(var(--base,0deg) - 11deg))}}',
      '@media (prefers-reduced-motion: reduce){.doodle{transition:opacity .4s ease}.doodle-art svg{animation:none}.doodle-art:hover{animation:none}}'
    ].join('\n');
    var s = document.createElement('style');
    s.id = 'doodle-css';
    s.textContent = css;
    document.head.appendChild(s);
  }

  /* ---- helpers ---- */
  function lum(r, g, b) { return (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255; }
  function parseRGB(str) {
    var m = String(str).match(/rgba?\(([^)]+)\)/);
    if (!m) return null;
    var p = m[1].split(',').map(parseFloat);
    return { r: p[0], g: p[1], b: p[2], a: p[3] === undefined ? 1 : p[3] };
  }
  function isDark(el) {
    var n = el;
    while (n && n !== document.documentElement) {
      var c = parseRGB(getComputedStyle(n).backgroundColor);
      if (c && c.a > 0.1) return lum(c.r, c.g, c.b) < 0.45;
      n = n.parentElement;
    }
    var b = parseRGB(getComputedStyle(document.body).backgroundColor);
    return b ? lum(b.r, b.g, b.b) < 0.45 : false;
  }

  function make(name, side, color, size, base) {
    var d = document.createElement('div');
    d.className = 'doodle';
    d.setAttribute('data-side', side);
    d.setAttribute('aria-hidden', 'true');
    d.style.width = d.style.height = size.toFixed(0) + 'px';
    var fly = document.createElement('div');
    fly.className = 'doodle-fly';
    var art = document.createElement('div');
    art.className = 'doodle-art';
    art.style.setProperty('--base', base);
    art.style.setProperty('color', color || 'inherit');
    art.innerHTML = svg(name);
    var g = art.querySelector('svg');
    g.style.setProperty('--fdur', (3.4 + Math.random() * 2.6).toFixed(2) + 's');
    g.style.setProperty('--fdel', (-Math.random() * 3.5).toFixed(2) + 's');
    fly.appendChild(art);
    d.appendChild(fly);
    d._fly = fly;
    d._size = size;
    d._size0 = size;
    return d;
  }

  function layoutOne(d, section) {
    var sr = section.getBoundingClientRect();
    var wrap = section.querySelector('.wrap');
    var cl, cr;
    if (wrap) {
      var wr = wrap.getBoundingClientRect();
      var pad = parseFloat(getComputedStyle(wrap).paddingLeft) || 0;
      cl = wr.left - sr.left + pad;
      cr = wr.right - sr.left - pad;
    } else {
      var p = parseFloat(getComputedStyle(section).paddingLeft) || 40;
      cl = p; cr = sr.width - p;
    }
    var m = 6, side = d.getAttribute('data-side');
    var avail = (side === 'left') ? (cl - m - 6) : (sr.width - (cr + 6) - m);
    if (avail < 26) { d.style.display = 'none'; return; }
    d.style.display = '';
    var sz = Math.min(d._size0, avail);
    d.style.width = d.style.height = sz.toFixed(0) + 'px';
    d._size = sz;
    var left;
    if (side === 'left') {
      var lo = m, hi = Math.max(lo, cl - sz - 6);
      left = lo + (hi - lo) * d._depth;
    } else {
      var rlo = cr + 6, rhi = Math.max(rlo, sr.width - sz - m);
      left = rlo + (rhi - rlo) * (1 - d._depth);
    }
    var top = d._vFrac * sr.height;
    top = Math.max(24, Math.min(sr.height - sz - 24, top));
    d.style.left = left.toFixed(0) + 'px';
    d.style.top = top.toFixed(0) + 'px';
  }

  /* ---- build ---- */
  function build(sections) {
    injectCSS();
    var io = new IntersectionObserver(function (ents) {
      ents.forEach(function (e) {
        var ds = e.target._doodles || [];
        if (e.isIntersecting) ds.forEach(function (d) { d.classList.add('lit'); });
        else ds.forEach(function (d) { d.classList.remove('lit'); });
      });
    }, { threshold: 0.04, rootMargin: '-4% 0px -4% 0px' });

    sections.forEach(function (section) {
      if (getComputedStyle(section).position === 'static') section.style.position = 'relative';
      var h = section.getBoundingClientRect().height;
      if (h < 240) return;
      var hero = section.classList.contains('hero');
      var n = hero ? 4 : Math.max(3, Math.min(8, Math.round(h / 330)));
      var dark = isDark(section);
      var list = [];
      for (var i = 0; i < n; i++) {
        var side = i % 2 ? 'right' : 'left';
        var name = NAMES[Math.floor(Math.random() * NAMES.length)];
        var color = Math.random() < 0.45 ? 'var(--accent)' : '';
        var size = 40 + Math.random() * 18;
        var base = (Math.random() * 28 - 14).toFixed(1) + 'deg';
        var d = make(name, side, color, size, base);
        d._vFrac = 0.08 + (i / Math.max(1, n - 1)) * 0.84 + (Math.random() * 0.07 - 0.035);
        d._depth = Math.random();
        d._sec = section;
        d.style.transitionDelay = (i * 0.06).toFixed(2) + 's';
        section.appendChild(d);
        layoutOne(d, section);
        if (REDUCE) d.classList.add('lit');
        list.push(d);
        ALL.push(d);
      }
      section._doodles = list;
      if (!REDUCE) io.observe(section);
    });

    if (!REDUCE) wireCursor();

    var rt;
    window.addEventListener('resize', function () {
      clearTimeout(rt);
      rt = setTimeout(function () {
        ALL.forEach(function (d) { layoutOne(d, d._sec); });
      }, 150);
    });
  }

  /* ---- cursor flee ---- */
  function wireCursor() {
    var mx = -9999, my = -9999, raf = 0;
    var R = 125, PUSH = 44;
    function step() {
      raf = 0;
      for (var i = 0; i < ALL.length; i++) {
        var d = ALL[i];
        if (!d.classList.contains('lit')) { if (d._fly.style.transform) d._fly.style.transform = ''; continue; }
        var r = d.getBoundingClientRect();
        var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
        var dx = cx - mx, dy = cy - my;
        var dist = Math.hypot(dx, dy) || 1;
        if (dist < R) {
          var f = (1 - dist / R) * PUSH;
          d._fly.style.transform = 'translate(' + (dx / dist * f).toFixed(1) + 'px,' + (dy / dist * f).toFixed(1) + 'px)';
        } else if (d._fly.style.transform) {
          d._fly.style.transform = '';
        }
      }
    }
    window.addEventListener('mousemove', function (e) {
      mx = e.clientX; my = e.clientY;
      if (!raf) raf = requestAnimationFrame(step);
    }, { passive: true });
    window.addEventListener('mouseout', function (e) {
      if (e.relatedTarget) return;
      mx = my = -9999;
      if (!raf) raf = requestAnimationFrame(step);
    });
  }

  /* =======================================================================
     PEEKERS — a couple of big characters that pop a half-head over a random
     screen edge, look around (eyes follow the cursor / dart when idle), then
     duck away and reappear elsewhere every few seconds.
     ======================================================================= */
  function injectPeekCSS() {
    if (document.getElementById('peeker-css')) return;
    var css = [
      '.peeker{position:fixed;z-index:210;pointer-events:none;}',
      '.peeker-head{position:absolute;left:0;top:0;will-change:transform;',
      '  transition:transform .72s cubic-bezier(.34,1.5,.5,1);',
      '  box-shadow:0 14px 30px rgba(0,0,0,.20),0 3px 8px rgba(0,0,0,.12),',
      '    inset 0 7px 14px rgba(255,255,255,.16),inset 0 -13px 22px rgba(0,0,0,.16),0 0 0 1px rgba(0,0,0,.05);}',
      '.peeker-eye{position:absolute;background:#fcfbf8;border-radius:50%;overflow:hidden;',
      '  box-shadow:inset 0 -1px 2px rgba(0,0,0,.13),inset 0 0 0 1px rgba(0,0,0,.15);',
      '  animation:peekBlink 5.6s ease-in-out infinite;transform-origin:50% 50%;}',
      '.peeker-pupil{position:absolute;background:#15120e;border-radius:50%;transition:transform .15s ease-out;}',
      '.peeker-glint{position:absolute;top:15%;left:17%;width:33%;height:33%;background:#fff;',
      '  border-radius:50%;opacity:.95;}',
      '.peeker-brow{position:absolute;background:#fcfbf8;border-radius:99px;transform-origin:50% 60%;',
      '  transition:transform .22s cubic-bezier(.34,1.4,.5,1);box-shadow:0 1px 1px rgba(0,0,0,.10);}',
      '.peeker .peeker-brow{transform:translateY(0) rotate(0deg);}',
      '.peeker.nervous .peeker-brow.bl{transform:translateY(calc(var(--br,4px) * -0.7)) rotate(-13deg);}',
      '.peeker.nervous .peeker-brow.br{transform:translateY(calc(var(--br,4px) * -0.7)) rotate(13deg);}',
      '.peeker.scared .peeker-brow.bl{transform:translateY(calc(var(--br,4px) * -1.5)) rotate(-21deg);}',
      '.peeker.scared .peeker-brow.br{transform:translateY(calc(var(--br,4px) * -1.5)) rotate(21deg);}',
      '@keyframes peekBlink{0%,5%,11%,100%{transform:scaleY(1)}8%{transform:scaleY(.10)}}',
      '@keyframes peekShake{0%,100%{transform:translateX(0)}15%{transform:translateX(-8px) rotate(-3deg)}30%{transform:translateX(8px) rotate(3deg)}45%{transform:translateX(-7px) rotate(-2deg)}60%{transform:translateX(6px) rotate(2deg)}80%{transform:translateX(-3px)}}',
      '@keyframes peekTremble{0%,100%{transform:translate(0,0)}25%{transform:translate(-1.6px,1px)}50%{transform:translate(1.4px,-1.2px)}75%{transform:translate(-1px,-1.4px)}}',
      '.peeker.nervous{animation:peekTremble .16s linear infinite}',
      '.peeker-mustache{position:absolute;pointer-events:none;color:#fcfbf8;}',
      '.peeker-mustache svg{display:block;width:100%;height:100%;}',
      '@media (prefers-reduced-motion: reduce){.peeker{display:none}}'
    ].join('\n');
    var s = document.createElement('style');
    s.id = 'peeker-css';
    s.textContent = css;
    document.head.appendChild(s);
  }

  function createPeekers() {
    if (REDUCE) return;
    if (!window.matchMedia('(min-width: 860px)').matches) return;
    if (window.__peekersOn) return;
    window.__peekersOn = true;
    injectPeekCSS();

    var mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2, t: 0 };
    window.addEventListener('mousemove', function (e) {
      mouse.x = e.clientX; mouse.y = e.clientY; mouse.t = performance.now();
    }, { passive: true });

    var HEADS = [
      { bg: 'var(--accent)', br: '50%' },
      { bg: 'var(--ink)', br: '47% 47% 50% 50% / 49% 49% 51% 51%' },
      { bg: 'var(--accent)', br: '42% 42% 46% 46%' },
      { bg: 'color-mix(in srgb, var(--accent) 52%, var(--ink))', br: '50%' },
      { bg: 'var(--ink)', br: '50%' }
    ];
    var EDGES = ['bottom', 'left', 'right', 'top', 'bottom', 'left', 'right'];

    function hideT(e) {
      if (e === 'bottom') return 'translateY(114%)';
      if (e === 'top') return 'translateY(-114%)';
      if (e === 'left') return 'translateX(-114%)';
      return 'translateX(114%)';
    }
    function peekT(e) {
      if (e === 'bottom') return 'translateY(40%)';
      if (e === 'top') return 'translateY(-40%)';
      if (e === 'left') return 'translateX(-38%)';
      return 'translateX(38%)';
    }

    function build() {
      var p = document.createElement('div'); p.className = 'peeker'; p.setAttribute('aria-hidden', 'true');
      var head = document.createElement('div'); head.className = 'peeker-head';
      var pk = { root: p, head: head, eyes: [], pupils: [], brows: [], idle: { x: 0, y: 0 }, idleT: 0, active: false };
      for (var i = 0; i < 2; i++) {
        var eye = document.createElement('div'); eye.className = 'peeker-eye';
        var pup = document.createElement('div'); pup.className = 'peeker-pupil';
        var glint = document.createElement('div'); glint.className = 'peeker-glint';
        pup.appendChild(glint); eye.appendChild(pup); head.appendChild(eye);
        var brow = document.createElement('div'); brow.className = 'peeker-brow ' + (i ? 'br' : 'bl');
        head.appendChild(brow);
        pk.eyes.push(eye); pk.pupils.push(pup); pk.brows.push(brow);
      }
      var mustache = document.createElement('div'); mustache.className = 'peeker-mustache';
      mustache.innerHTML = '<svg viewBox="0 0 100 36" fill="none" stroke="currentColor" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" style="transform:scaleY(-1)"><path d="M50,20 C44,15 32,11 20,15 C11,18 8,26 12,31 C16,35 24,31 26,23 C27,17 20,14 16,18"/><path d="M50,20 C56,15 68,11 80,15 C89,18 92,26 88,31 C84,35 76,31 74,23 C73,17 80,14 84,18"/></svg>';
      head.appendChild(mustache);
      pk.mustache = mustache;
      p.appendChild(head); document.body.appendChild(p);
      return pk;
    }

    function place(pk) {
      var st = HEADS[Math.floor(Math.random() * HEADS.length)];
      var edge = EDGES[Math.floor(Math.random() * EDGES.length)];
      var W = 72 + Math.random() * 26, H = W * (0.94 + Math.random() * 0.14);
      pk.edge = edge;
      pk.head.style.width = W + 'px'; pk.head.style.height = H + 'px';
      pk.head.style.background = st.bg; pk.head.style.borderRadius = st.br;
      var r = pk.root.style;
      r.left = r.right = r.top = r.bottom = '';
      r.width = W + 'px'; r.height = H + 'px';
      if (edge === 'bottom' || edge === 'top') {
        r.left = (70 + Math.random() * Math.max(0, window.innerWidth - W - 140)).toFixed(0) + 'px';
        if (edge === 'bottom') r.bottom = '0px'; else r.top = '0px';
      } else {
        r.top = Math.max(72, 96 + Math.random() * Math.max(0, window.innerHeight - H - 200)).toFixed(0) + 'px';
        if (edge === 'left') r.left = '0px'; else r.right = '0px';
      }
      // a frontal face placed within the visible half (upright on every edge)
      var cx, cy;
      if (edge === 'bottom') { cx = W * 0.5; cy = H * 0.34; }
      else if (edge === 'top') { cx = W * 0.5; cy = H * 0.66; }
      else if (edge === 'left') { cx = W * 0.64; cy = H * 0.5; }
      else { cx = W * 0.36; cy = H * 0.5; }
      var es = W * 0.235, ps = es * 0.54, eyeDX = W * 0.145;
      pk.maxOff = (es - ps) / 2 - 1;
      pk.root.style.setProperty('--br', (H * 0.06).toFixed(1) + 'px');
      var pair = [[cx - eyeDX, cy], [cx + eyeDX, cy]];
      pk.eyes.forEach(function (eye, i) {
        eye.style.width = es + 'px'; eye.style.height = es + 'px';
        eye.style.left = (pair[i][0] - es / 2).toFixed(1) + 'px';
        eye.style.top = (pair[i][1] - es / 2).toFixed(1) + 'px';
        eye.style.animationDelay = (-Math.random() * 5).toFixed(2) + 's';
      });
      pk.pupils.forEach(function (pp) {
        pp.style.width = ps + 'px'; pp.style.height = ps + 'px';
        pp.style.left = (es / 2 - ps / 2).toFixed(1) + 'px';
        pp.style.top = (es / 2 - ps / 2).toFixed(1) + 'px';
        pp.style.transform = '';
      });
      var bw = es * 1.18, bh = Math.max(3, es * 0.18);
      pk.brows.forEach(function (brow, i) {
        brow.style.width = bw + 'px'; brow.style.height = bh + 'px'; brow.style.borderRadius = bh + 'px';
        brow.style.left = (pair[i][0] - bw / 2).toFixed(1) + 'px';
        brow.style.top = (pair[i][1] - es * 0.80).toFixed(1) + 'px';
      });
      var mw = W * 0.64, mh = mw * 0.36;
      pk.mustache.style.width = mw + 'px';
      pk.mustache.style.height = mh + 'px';
      pk.mustache.style.left = (cx - mw / 2).toFixed(1) + 'px';
      pk.mustache.style.top = (cy + es * 0.60).toFixed(1) + 'px';
      pk.head.style.transform = hideT(edge);
    }

    var peekers = [build(), build()];
    var FEAR = 150;

    function appear(pk) {
      for (var tries = 0; tries < 4; tries++) {
        place(pk);
        var rr = pk.root.getBoundingClientRect();
        var cx = rr.left + rr.width / 2, cy = rr.top + rr.height / 2;
        if (Math.hypot(mouse.x - cx, mouse.y - cy) > FEAR * 1.5) break;
      }
      pk.root.getBoundingClientRect();
      pk.active = true; pk.scared = false;
      pk.root.classList.remove('nervous');
      pk.root.classList.remove('scared');
      pk.root.style.animation = '';
      pk.head.style.transition = '';
      requestAnimationFrame(function () {
        requestAnimationFrame(function () { pk.head.style.transform = peekT(pk.edge); });
      });
      var hold = 2600 + Math.random() * 2400;
      pk.holdTimer = setTimeout(function () { retract(pk, false); }, 740 + hold);
    }

    function retract(pk, scared) {
      if (pk.holdTimer) clearTimeout(pk.holdTimer);
      pk.active = false;
      pk.root.classList.remove('nervous');
      if (scared) pk.head.style.transition = 'transform .32s cubic-bezier(.5,0,.78,.25)';
      pk.head.style.transform = hideT(pk.edge);
      var gap = scared ? (1700 + Math.random() * 2400) : (1300 + Math.random() * 2800);
      pk.nextTimer = setTimeout(function () { appear(pk); }, gap + 740);
    }

    function flee(pk) {
      if (pk.scared || !pk.active) return;
      pk.scared = true;
      pk.root.classList.remove('nervous');
      pk.root.classList.add('scared');
      pk.root.style.animation = 'none';
      void pk.root.offsetWidth;
      pk.root.style.animation = 'peekShake .32s ease 1';
      setTimeout(function () { retract(pk, true); }, 210);
    }

    function gaze() {
      var now = performance.now();
      var follow = (now - mouse.t) < 1700;
      for (var k = 0; k < peekers.length; k++) {
        var pk = peekers[k];
        if (!pk.active) continue;
        var hr = pk.head.getBoundingClientRect();
        if (!hr.width) continue;
        var hcx = hr.left + hr.width / 2, hcy = hr.top + hr.height / 2;
        var hd = Math.hypot(mouse.x - hcx, mouse.y - hcy);
        if (!pk.scared && hd < FEAR) { flee(pk); continue; }
        var afraid = !pk.scared && hd < FEAR * 1.7;
        if (!pk.scared) {
          if (afraid) pk.root.classList.add('nervous');
          else pk.root.classList.remove('nervous');
        }
        var calm = !afraid && !pk.scared;
        if (calm && !follow && now - pk.idleT > 650 + Math.random() * 700) {
          pk.idleT = now;
          var a = Math.random() * Math.PI * 2;
          pk.idle.x = Math.cos(a); pk.idle.y = Math.sin(a) * 0.7;
        }
        for (var i = 0; i < pk.eyes.length; i++) {
          var er = pk.eyes[i].getBoundingClientRect();
          if (!er.width) continue;
          var ecx = er.left + er.width / 2, ecy = er.top + er.height / 2;
          var dx, dy, sc;
          if (afraid || pk.scared) { dx = ecx - mouse.x; dy = ecy - mouse.y; sc = 0.7; }
          else if (follow) { dx = mouse.x - ecx; dy = mouse.y - ecy; sc = 1; }
          else { dx = pk.idle.x; dy = pk.idle.y; sc = 1; }
          var d = Math.hypot(dx, dy) || 1;
          var off = pk.maxOff * (afraid || pk.scared ? 0.95 : 1);
          pk.pupils[i].style.transform = 'translate(' +
            (dx / d * off).toFixed(1) + 'px,' + (dy / d * off).toFixed(1) + 'px) scale(' + sc + ')';
        }
      }
      requestAnimationFrame(gaze);
    }
    requestAnimationFrame(gaze);

    setTimeout(function () { appear(peekers[0]); }, 1100);
    setTimeout(function () { appear(peekers[1]); }, 3200);
  }

  /* ---- start (wait for React mount) ---- */
  function start() {
    if (started || !mq.matches) return;
    var sections = Array.prototype.slice.call(document.querySelectorAll('#root section'));
    if (sections.length < 3) { setTimeout(start, 200); return; }
    started = true;
    build(sections);
  }
  if (mq.addEventListener) mq.addEventListener('change', start);
  if (document.readyState === 'loading') {
    window.addEventListener('DOMContentLoaded', function () {
      setTimeout(start, 350);
      setTimeout(createPeekers, 900);
    });
  } else {
    setTimeout(start, 350);
    setTimeout(createPeekers, 900);
  }
})();

  </script>
</body>
</html>
